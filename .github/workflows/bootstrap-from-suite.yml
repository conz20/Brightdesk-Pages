name: Bootstrap Brightdesk Pages from approved suite seed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Populate standalone Pages repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out this Pages repository
        uses: actions/checkout@v4
        with:
          path: pages-repository

      - name: Check out approved Brightdesk suite source
        uses: actions/checkout@v4
        with:
          repository: connormolloy12/Brightdesk-suite
          ref: feature/standalone-downloads-all-ten
          path: suite-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: Generate the official standalone repository seed
        working-directory: suite-source
        run: node scripts/create-app-repository-seeds.js

      - name: Copy only Brightdesk Pages into this repository
        run: |
          rsync -a --delete --exclude='.git' \
            suite-source/release/app-repository-seeds/Brightdesk-Pages/ \
            pages-repository/

      - name: Commit standalone Pages source
        working-directory: pages-repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No Pages seed changes to commit."
          else
            git commit -m "Bootstrap Brightdesk Pages standalone app"
            git push
          fi
