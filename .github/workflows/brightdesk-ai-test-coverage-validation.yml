name: Brightdesk AI test coverage validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/brightdesk-ai-test-coverage-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brightdesk-ai-test-coverage-validation
  cancel-in-progress: false

jobs:
  private-auditor-tests:
    name: Test the pinned private auditor revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the public controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Check private GitHub App credentials
        id: credentials
        shell: bash
        env:
          APP_ID: ${{ vars.BRIGHTDESK_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Required read-only GitHub App credentials are missing."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Mint a short-lived token for Brightdesk-AI only
        id: app-token
        if: steps.credentials.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BRIGHTDESK_APP_ID }}
          private-key: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
          owner: connormolloy12
          repositories: Brightdesk-AI
          permission-contents: read

      - name: Check out the pinned private auditor revision
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: connormolloy12/Brightdesk-AI
          ref: 7c00831645d9c741d1b55bc202081214add7ce38
          token: ${{ steps.app-token.outputs.token }}
          path: private-ai
          persist-credentials: false

      - name: Pull the Node.js 24.22.2 test image
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          if ! docker pull node:24.22.2-bookworm-slim >/dev/null 2>&1; then
            echo "Could not prepare the Node.js test container." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run unit tests in a network-isolated container
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set +e
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=128 \
            --memory=512m \
            --cpus=1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --volume "$GITHUB_WORKSPACE/private-ai:/workspace:ro" \
            --workdir /workspace \
            node:24.22.2-bookworm-slim node --test \
            > "$RUNNER_TEMP/brightdesk-private-ai-tests.log" 2>&1
          result=$?
          set -e
          if [[ "$result" -eq 0 ]]; then
            echo "## Private Brightdesk-AI validation" >> "$GITHUB_STEP_SUMMARY"
            echo "- Pinned revision: 7c00831645d9c741d1b55bc202081214add7ce38" >> "$GITHUB_STEP_SUMMARY"
            echo "- Unit tests: **PASSED**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Private Brightdesk-AI validation" >> "$GITHUB_STEP_SUMMARY"
            echo "- Pinned revision: 7c00831645d9c741d1b55bc202081214add7ce38" >> "$GITHUB_STEP_SUMMARY"
            echo "- Unit tests: **FAILED**. Detailed output was withheld." >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          fi

      - name: Remove the private checkout
        if: always()
        shell: bash
        run: rm -rf private-ai
