name: Brightdesk private AI validation

on:
  schedule:
    - cron: '31 17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brightdesk-ai-validation.yml'

permissions:
  contents: read

concurrency:
  group: brightdesk-private-ai-validation
  cancel-in-progress: false

jobs:
  private-auditor-tests:
    name: Test the pinned private auditor revision
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the public controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check private GitHub App credentials
        id: credentials
        shell: bash
        env:
          APP_ID: ${{ vars.BRIGHTDESK_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Required read-only GitHub App credentials are missing. Configure BRIGHTDESK_APP_ID and BRIGHTDESK_APP_PRIVATE_KEY before running private AI validation."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Mint a short-lived token for Brightdesk-AI only
        id: app-token
        if: steps.credentials.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BRIGHTDESK_APP_ID }}
          private-key: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
          owner: connormolloy12
          repositories: Brightdesk-AI
          permission-contents: read

      - name: Check out the pinned private auditor revision
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: connormolloy12/Brightdesk-AI
          ref: a142db98f153ea357c675bdbe60960f4b24d6f56
          token: ${{ steps.app-token.outputs.token }}
          path: private-ai
          persist-credentials: false

      - name: Pull the pinned Node.js test image
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          if ! docker pull node:24.22.2-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c >/dev/null 2>&1; then
            echo "Could not prepare the Node.js test container." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run unit tests in a network-isolated container
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set +e
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=128 \
            --memory=512m \
            --cpus=1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --volume "$GITHUB_WORKSPACE/private-ai:/workspace:ro" \
            --workdir /workspace \
            node:24.22.2-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c node --test \
            > "$RUNNER_TEMP/brightdesk-private-ai-tests.log" 2>&1
          result=$?
          set -e
          if [[ "$result" -eq 0 ]]; then
            echo "## Private Brightdesk-AI validation" >> "$GITHUB_STEP_SUMMARY"
            echo "- Pinned auditor revision: validated" >> "$GITHUB_STEP_SUMMARY"
            echo "- Unit tests: **PASSED**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Private Brightdesk-AI validation" >> "$GITHUB_STEP_SUMMARY"
            echo "- Pinned auditor revision: checked" >> "$GITHUB_STEP_SUMMARY"
            echo "- Unit tests: **FAILED**. Detailed output was withheld to keep private source and test output out of public logs." >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          fi

      - name: Remove the private checkout
        if: always()
        shell: bash
        run: rm -rf private-ai
