name: Brightdesk Pages desktop installers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_installers:
        description: Build the Windows, macOS and Linux desktop installers
        type: boolean
        required: true
        default: false
      publish_release:
        description: Publish a release after all desktop installers pass verification
        type: boolean
        required: true
        default: false
      release_tag:
        description: Release tag
        type: string
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  test:
    name: Check Brightdesk Pages
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build:
    name: Build ${{ matrix.platform }} desktop installer
    if: github.event_name == 'workflow_dispatch' && inputs.build_installers == true
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: windows-latest
          - platform: mac
            runner: macos-latest
          - platform: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:desktop:${{ matrix.platform }}
      - run: npm run verify:desktop:${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Brightdesk-Pages-${{ matrix.platform }}
          path: release/apps/pages/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish approved Brightdesk Pages release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Brightdesk-Pages-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Brightdesk Pages ${{ inputs.release_tag }}
          generate_release_notes: true
          files: release/**
