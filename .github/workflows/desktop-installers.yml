name: Brightdesk Pages desktop installers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_installers:
        description: Build the Windows, macOS and Linux desktop installers
        type: boolean
        required: true
        default: false
      publish_release:
        description: Publish a release after all desktop installers pass verification
        type: boolean
        required: true
        default: false
      release_tag:
        description: Release tag
        type: string
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  test:
    name: Check Brightdesk Pages
    runs-on: [self-hosted, macOS, ARM64, brightdesk-product-ci]
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run visual:smoke
      - name: Publish compressed screenshots without Actions artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-visual-evidence-checks.js

  build:
    name: Build ${{ matrix.platform }} desktop installer
    if: github.event_name == 'workflow_dispatch' && inputs.build_installers == true
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: ["self-hosted", "Windows", "X64"]
          - platform: mac
            runner: ["self-hosted", "macOS", "ARM64"]
          - platform: linux
            runner: ["self-hosted", "Linux", "X64"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:desktop:${{ matrix.platform }}
      - run: npm run verify:desktop:${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Brightdesk-Pages-${{ matrix.platform }}
          path: release/apps/pages/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish approved Brightdesk Pages release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    needs: build
    runs-on: [self-hosted, macOS, ARM64, brightdesk-product-ci]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Brightdesk-Pages-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Brightdesk Pages ${{ inputs.release_tag }}
          generate_release_notes: true
          files: release/**
