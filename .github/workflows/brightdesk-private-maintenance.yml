name: Brightdesk private project maintenance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/brightdesk-private-maintenance.yml'
      - '.github/workflows/brightdesk-ai-validation.yml'
      - '.github/workflows/brightdesk-ai-test-coverage-validation.yml'
      - 'scripts/brightdesk-private-runner/**'
      - 'tests/brightdesk-private-runner.test.js'
      - 'tests/private-test-diagnostics.test.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/brightdesk-private-maintenance.yml'
      - '.github/workflows/brightdesk-ai-validation.yml'
      - '.github/workflows/brightdesk-ai-test-coverage-validation.yml'
      - 'scripts/brightdesk-private-runner/**'
      - 'tests/brightdesk-private-runner.test.js'
      - 'tests/private-test-diagnostics.test.js'
  schedule:
    - cron: '13 17 * * *'
    - cron: '17 17 * * 0'
  workflow_dispatch:
    inputs:
      run_cross_platform_builds:
        description: Build and verify all private project installers on Windows, macOS and Linux
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: brightdesk-private-project-maintenance
  cancel-in-progress: false

jobs:
  validate-controller:
    name: Validate the public maintenance controller
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Brightdesk Pages
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up the required Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
      - name: Check the private project runner script
        shell: bash
        run: |
          bash -n scripts/brightdesk-private-runner/run-private-project-check.sh
          node --test tests/brightdesk-private-runner.test.js tests/private-test-diagnostics.test.js

  daily-private-tests:
    name: Test ${{ matrix.project }} on Linux
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - Brightdesk-suite
          - Brightdesk-Sheets
          - Brightdesk-Decks
          - Brightdesk-Notes
          - Brightdesk-Database
          - Brightdesk-Forms
        include:
          - project: Brightdesk-suite
            ref: fix/suite-diagnostic-tests
    steps:
      - name: Check out the public controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: controller
      - name: Check whether read-only GitHub App credentials are configured
        id: private-token
        shell: bash
        env:
          APP_ID: ${{ vars.BRIGHTDESK_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Private project checks are paused until BRIGHTDESK_APP_ID and BRIGHTDESK_APP_PRIVATE_KEY are configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create a short-lived read-only token for this project
        id: app-token
        if: steps.private-token.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BRIGHTDESK_APP_ID }}
          private-key: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
          owner: connormolloy12
          repositories: ${{ matrix.project }}
          permission-contents: read
      - name: Check out the private Brightdesk project
        if: steps.private-token.outputs.available == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: connormolloy12/${{ matrix.project }}
          ref: ${{ matrix.ref || 'main' }}
          token: ${{ steps.app-token.outputs.token }}
          path: source
          persist-credentials: false
      - name: Set up the required Node.js runtime
        if: steps.private-token.outputs.available == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Run private project tests without publishing source logs
        id: run-private-check
        if: steps.private-token.outputs.available == 'true'
        shell: bash
        run: |
          bash controller/scripts/brightdesk-private-runner/run-private-project-check.sh \
            test source "${{ matrix.project }}"
      - name: Create an issue-only token for the private Suite diagnostic
        id: issue-token
        if: failure() && matrix.project == 'Brightdesk-suite' && steps.run-private-check.outputs.failure_summary_file != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BRIGHTDESK_APP_ID }}
          private-key: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
          owner: connormolloy12
          repositories: Brightdesk-suite
          permission-issues: write
      - name: Save sanitized failure names to the private Suite issue
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.issue-token.outputs.token }}
          BRIGHTDESK_PROJECT: ${{ matrix.project }}
          BRIGHTDESK_TEST_OUTCOME: ${{ steps.run-private-check.outcome }}
          BRIGHTDESK_FAILURE_SUMMARY_FILE: ${{ steps.run-private-check.outputs.failure_summary_file }}
        shell: bash
        run: |
          if [[ "$BRIGHTDESK_PROJECT" == "Brightdesk-suite" &&
                "$BRIGHTDESK_TEST_OUTCOME" == "failure" &&
                -n "$GITHUB_TOKEN" &&
                -s "$BRIGHTDESK_FAILURE_SUMMARY_FILE" ]]; then
            node controller/scripts/brightdesk-private-runner/report-private-test-failure.js
          else
            echo "No private Suite diagnostic report is required for this job."
          fi

  weekly-private-installer-builds:
    name: Build ${{ matrix.project }} for ${{ matrix.platform }}
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 17 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_cross_platform_builds == true)
    needs: daily-private-tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Brightdesk-suite
            platform: win
            runner: windows-latest
            verify_script: release:verify:win
          - project: Brightdesk-suite
            platform: mac
            runner: macos-latest
            verify_script: release:verify:mac
          - project: Brightdesk-suite
            platform: linux
            runner: ubuntu-latest
            verify_script: release:verify:linux
          - project: Brightdesk-Sheets
            platform: win
            runner: windows-latest
            verify_script: verify:product:win
          - project: Brightdesk-Sheets
            platform: mac
            runner: macos-latest
            verify_script: verify:product:mac
          - project: Brightdesk-Sheets
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:product:linux
          - project: Brightdesk-Decks
            platform: win
            runner: windows-latest
            verify_script: verify:product:win
          - project: Brightdesk-Decks
            platform: mac
            runner: macos-latest
            verify_script: verify:product:mac
          - project: Brightdesk-Decks
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:product:linux
          - project: Brightdesk-Notes
            platform: win
            runner: windows-latest
            verify_script: verify:product:win
          - project: Brightdesk-Notes
            platform: mac
            runner: macos-latest
            verify_script: verify:product:mac
          - project: Brightdesk-Notes
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:product:linux
          - project: Brightdesk-Database
            platform: win
            runner: windows-latest
            verify_script: verify:product:win
          - project: Brightdesk-Database
            platform: mac
            runner: macos-latest
            verify_script: verify:product:mac
          - project: Brightdesk-Database
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:product:linux
          - project: Brightdesk-Forms
            platform: win
            runner: windows-latest
            verify_script: verify:product:win
          - project: Brightdesk-Forms
            platform: mac
            runner: macos-latest
            verify_script: verify:product:mac
          - project: Brightdesk-Forms
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:product:linux
    steps:
      - name: Check out the public controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: controller
      - name: Check whether read-only GitHub App credentials are configured
        id: private-token
        shell: bash
        env:
          APP_ID: ${{ vars.BRIGHTDESK_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Private project checks are paused until BRIGHTDESK_APP_ID and BRIGHTDESK_APP_PRIVATE_KEY are configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create a short-lived read-only token for this project
        id: app-token
        if: steps.private-token.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BRIGHTDESK_APP_ID }}
          private-key: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
          owner: connormolloy12
          repositories: ${{ matrix.project }}
          permission-contents: read
      - name: Check out the private Brightdesk project
        if: steps.private-token.outputs.available == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: connormolloy12/${{ matrix.project }}
          token: ${{ steps.app-token.outputs.token }}
          path: source
          persist-credentials: false
      - name: Set up the required Node.js runtime
        if: steps.private-token.outputs.available == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Build and verify the selected installer without publishing it
        if: steps.private-token.outputs.available == 'true'
        shell: bash
        run: |
          bash controller/scripts/brightdesk-private-runner/run-private-project-check.sh \
            build source "${{ matrix.project }}" "${{ matrix.platform }}" "${{ matrix.verify_script }}"
