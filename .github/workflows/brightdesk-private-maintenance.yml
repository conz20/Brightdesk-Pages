name: Brightdesk private project maintenance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/brightdesk-private-maintenance.yml'
      - '.github/workflows/brightdesk-ai-validation.yml'
      - '.github/workflows/brightdesk-ai-test-coverage-validation.yml'
      - 'scripts/brightdesk-private-runner/**'
      - 'tests/brightdesk-private-runner.test.js'
      - 'tests/private-test-diagnostics.test.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/brightdesk-private-maintenance.yml'
      - '.github/requests/brightdesk-suite-installers.request'
      - '.github/workflows/brightdesk-ai-validation.yml'
      - '.github/workflows/brightdesk-ai-test-coverage-validation.yml'
      - 'scripts/brightdesk-private-runner/**'
      - 'tests/brightdesk-private-runner.test.js'
      - 'tests/private-test-diagnostics.test.js'
  schedule:
    - cron: '13 17 * * *'
    - cron: '17 17 * * 0'
  workflow_dispatch:
    inputs:
      project:
        description: Private project to test, or all private projects
        type: choice
        required: true
        default: all
        options:
          - all
          - Brightdesk-suite
          - Brightdesk-Sheets
          - Brightdesk-Decks
          - Brightdesk-Notes
          - Brightdesk-Database
          - Brightdesk-Forms
          - Brightdesk-Lists
          - Brightdesk-Planner
          - Brightdesk-To-Do
          - Brightdesk-Workspace
      project_ref:
        description: Branch, tag or commit to test for the selected project (ignored when all projects are selected)
        type: string
        required: true
        default: main
      run_cross_platform_builds:
        description: Build and verify all private project installers on Windows, macOS and Linux
        type: boolean
        required: true
        default: false
      run_reviewed_product_pr_matrix:
        description: Test the ten currently reviewed product PR heads on Linux using read-only tokens (no installer builds)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('brightdesk-private-maintenance-pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-brightdesk-suite-installers]') && format('brightdesk-suite-installer-request-{0}', github.sha)) || 'brightdesk-private-project-maintenance' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-controller:
    name: Validate the Brightdesk maintenance controller
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-slim
    steps:
      - name: Check out Brightdesk Pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up the required Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - name: Check the private project runner script
        shell: bash
        run: |
          bash -n scripts/brightdesk-private-runner/run-private-project-check.sh
          node --test tests/brightdesk-private-runner.test.js tests/private-test-diagnostics.test.js

  daily-private-tests:
    name: Test ${{ matrix.project }} on Linux
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      (github.event_name != 'workflow_dispatch' || (inputs.run_reviewed_product_pr_matrix != true && (inputs.project == 'all' || matrix.project == inputs.project)))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - Brightdesk-suite
          - Brightdesk-Sheets
          - Brightdesk-Decks
          - Brightdesk-Notes
          - Brightdesk-Database
          - Brightdesk-Forms
          - Brightdesk-Lists
          - Brightdesk-Planner
          - Brightdesk-To-Do
          - Brightdesk-Workspace
    steps:
      - name: Check out the Brightdesk Pages controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
      - name: Check whether read-only GitHub App credentials are configured
        id: private-token
        shell: bash
        env:
          APP_ID: ${{ vars.BRIGHTDESK_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Private project checks are paused until BRIGHTDESK_APP_ID and BRIGHTDESK_APP_PRIVATE_KEY are configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create a short-lived read-only token for this project
        id: app-token
        if: steps.private-token.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BRIGHTDESK_APP_ID }}
          private-key: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.project }}
          permission-contents: read
      - name: Check out the private Brightdesk project
        if: steps.private-token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.project != 'all' && matrix.project == inputs.project && inputs.project_ref || (matrix.project == 'Brightdesk-suite' && 'ci/github-hosted-runners-independent-of-macbook' || 'main') }}
          token: ${{ steps.app-token.outputs.token }}
          path: source
          persist-credentials: false
      - name: Set up the required Node.js runtime
        if: steps.private-token.outputs.available == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Run private project tests without publishing source logs
        id: run-private-check
        if: steps.private-token.outputs.available == 'true'
        shell: bash
        run: |
          bash controller/scripts/brightdesk-private-runner/run-private-project-check.sh \
            test source "${{ matrix.project }}"
      - name: Create an issue-only token for the private Suite diagnostic
        id: issue-token
        if: failure() && matrix.project == 'Brightdesk-suite' && steps.run-private-check.outputs.failure_summary_file != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BRIGHTDESK_APP_ID }}
          private-key: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Brightdesk-suite
          permission-issues: write
      - name: Save sanitized failure names to the private Suite issue
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.issue-token.outputs.token }}
          BRIGHTDESK_PROJECT: ${{ matrix.project }}
          BRIGHTDESK_TEST_OUTCOME: ${{ steps.run-private-check.outcome }}
          BRIGHTDESK_FAILURE_SUMMARY_FILE: ${{ steps.run-private-check.outputs.failure_summary_file }}
        shell: bash
        run: |
          if [[ "$BRIGHTDESK_PROJECT" == "Brightdesk-suite" &&
                "$BRIGHTDESK_TEST_OUTCOME" == "failure" &&
                -n "$GITHUB_TOKEN" &&
                -s "$BRIGHTDESK_FAILURE_SUMMARY_FILE" ]]; then
            node controller/scripts/brightdesk-private-runner/report-private-test-failure.js
          else
            echo "No private Suite diagnostic report is required for this job."
          fi

  reviewed-product-pr-tests:
    name: Validate ${{ matrix.project }} PR #${{ matrix.pr_number }} on Linux
    if: github.event_name == 'workflow_dispatch' && inputs.run_reviewed_product_pr_matrix == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Brightdesk-Sheets
            pr_number: 48
            project_ref: legal/brightdesk-licence-security-brand-2026-11-28
            expected_head_sha: 9063fd07abe275016bf894a68af1d7a77f57a8ed
            base_sha: 284bd578d4abe69fe13c5d3d6102aca4a730299d
          - project: Brightdesk-Decks
            pr_number: 48
            project_ref: legal/brightdesk-licence-security-brand-2026-11-28
            expected_head_sha: 1a7d7eed376addec3c0867b8cef5ac6e2f27bb3f
            base_sha: 7c89a79f6b2a03f43bec2a162307e3dafee8f951
          - project: Brightdesk-Notes
            pr_number: 43
            project_ref: legal/brightdesk-licence-security-brand-2026-11-28
            expected_head_sha: c1eb924171bad1ffa9d1c74fa69a979dc23ae7db
            base_sha: fae342534d360c983131f93a4df7e7b8ae5d1148
          - project: Brightdesk-Database
            pr_number: 44
            project_ref: legal/brightdesk-licence-security-brand-2026-11-28
            expected_head_sha: 223cec0c893eb0e9cf2dc698570ac8f900bd5e9b
            base_sha: b3323349193661cfe8537cc193587f843fcfef9b
          - project: Brightdesk-Forms
            pr_number: 44
            project_ref: legal/brightdesk-licence-security-brand-2026-11-28
            expected_head_sha: a00b0b11a034de8e61309f06f4880cf95f4324f2
            base_sha: 4b1ce62b9bcc463f2599a2e3099398f6267b2fce
          - project: Brightdesk-Lists
            pr_number: 27
            project_ref: legal/brightdesk-licence-security-brand-2026-11-28
            expected_head_sha: 4eee7ae0fffbdcdc5df8a021c767a79dc1825fea
            base_sha: 960bf3b99988842e44111b08a2194315d6c947e2
          - project: Brightdesk-Planner
            pr_number: 26
            project_ref: legal/brightdesk-licence-security-brand-2026-11-28
            expected_head_sha: 5324585a8c7a03cad7f418b2e115d194189c2219
            base_sha: 2183313f5c6f80238e62fb57fc1851c6a769004a
          - project: Brightdesk-To-Do
            pr_number: 24
            project_ref: legal/brightdesk-licence-security-brand-2026-11-28
            expected_head_sha: f1e072500717cb494ff2c2b6de7347c2aa321a5f
            base_sha: f9c9f87c303ce78f8554a92ce026ee686b5a19f8
          - project: Brightdesk-Workspace
            pr_number: 25
            project_ref: legal/brightdesk-licence-security-brand-2026-11-28
            expected_head_sha: b500fc5a386d02d0e0b710582a61e923315a24ea
            base_sha: d7cd16788e0e1fdd1c2255ed8706dfc2815c2f14
          - project: Brightdesk-Lists
            pr_number: 26
            project_ref: security/official-dictionary-resources-only
            expected_head_sha: ea94a8acee1331321100c707151955698831c74c
            base_sha: 960bf3b99988842e44111b08a2194315d6c947e2
    steps:
      - name: Check out the Brightdesk Pages controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - name: Require owner-configured private check credentials
        shell: bash
        env:
          APP_ID: ${{ vars.BRIGHTDESK_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::The Brightdesk read-only GitHub App credentials are not configured."
            exit 1
          fi
      - name: Create a short-lived Contents read-only token for this project
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BRIGHTDESK_APP_ID }}
          private-key: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.project }}
          permission-contents: read
      - name: Check out the exact reviewed private PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          ref: ${{ matrix.project_ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact PR head and README freshness
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ matrix.expected_head_sha }}
          BASE_SHA: ${{ matrix.base_sha }}
          PR_NUMBER: ${{ matrix.pr_number }}
          PROJECT: ${{ matrix.project }}
        run: |
          set -Eeuo pipefail
          actual_head="$(git -C source rev-parse HEAD)"
          if [[ "$actual_head" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "::error::$PROJECT PR #$PR_NUMBER head changed since this matrix was reviewed. Refresh the pinned ref and SHA before running again."
            exit 1
          fi
          if ! git -C source cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::error::The recorded base commit for $PROJECT PR #$PR_NUMBER is unavailable. Refresh its base SHA before running again."
            exit 1
          fi
          if [[ ! -f source/README.md ]]; then
            echo "::error::$PROJECT PR #$PR_NUMBER has no root README.md."
            exit 1
          fi
          changed_files="$(git -C source diff --name-only "$BASE_SHA...$actual_head")"
          readme_changed=false
          non_markdown_changed=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ "$file" == "README.md" ]]; then
              readme_changed=true
            fi
            case "$file" in
              *.md|*.mdx|.github/workflows/readme-freshness.yml)
                ;;
              *)
                non_markdown_changed=true
                ;;
            esac
          done <<< "$changed_files"
          if [[ "$non_markdown_changed" == "true" && "$readme_changed" != "true" ]]; then
            echo "::error::$PROJECT PR #$PR_NUMBER changes non-Markdown files without updating the root README.md."
            exit 1
          fi
          echo "Exact PR head and README freshness verified for $PROJECT PR #$PR_NUMBER."
      - name: Set up the required Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Run private project tests without publishing source logs
        shell: bash
        run: |
          bash controller/scripts/brightdesk-private-runner/run-private-project-check.sh \
            test source "${{ matrix.project }}"

  daily-private-foundation-tests:
    name: Test ${{ matrix.project }} on Linux
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      (github.event_name != 'workflow_dispatch' || (inputs.run_reviewed_product_pr_matrix != true && inputs.project == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - Brightdesk-Common-Libs
          - Brightdesk-Developer-Tools
    steps:
      - name: Check out the Brightdesk Pages controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
      - name: Check whether read-only GitHub App credentials are configured
        id: private-token
        shell: bash
        env:
          APP_ID: ${{ vars.BRIGHTDESK_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Shared engineering checks are paused until the Brightdesk App credentials are configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create a short-lived read-only token for this project
        id: app-token
        if: steps.private-token.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BRIGHTDESK_APP_ID }}
          private-key: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.project }}
          permission-contents: read
      - name: Check out the private Brightdesk engineering project
        if: steps.private-token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          token: ${{ steps.app-token.outputs.token }}
          path: source
          persist-credentials: false
      - name: Read the exact Node.js version from the project manifest
        id: node-version
        if: steps.private-token.outputs.available == 'true'
        working-directory: source
        shell: bash
        run: |
          node_version="$(node -e "const manifest = require('./package.json'); process.stdout.write(manifest.engines?.node ?? '')")"
          if [[ ! "$node_version" =~ ^24\.[0-9]+\.[0-9]+$ ]]; then
            echo "The project does not declare a supported exact Node.js 24 runtime." >&2
            exit 1
          fi
          printf 'value=%s\n' "$node_version" >> "$GITHUB_OUTPUT"
      - name: Set up the project-pinned Node.js runtime
        if: steps.private-token.outputs.available == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node-version.outputs.value }}
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Run private engineering checks without publishing source logs
        if: steps.private-token.outputs.available == 'true'
        working-directory: source
        env:
          BRIGHTDESK_PROJECT: ${{ matrix.project }}
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          set -Eeuo pipefail
          log_file="$RUNNER_TEMP/brightdesk-foundation-validation.log"
          fail_stage() {
            local stage="$1"
            local status="$2"
            {
              echo "## Private Brightdesk engineering validation"
              echo
              echo "- Project: $BRIGHTDESK_PROJECT"
              echo "- Result: **FAILED**"
              echo "- Failed stage: $stage"
              echo "- Detailed output was kept only on the temporary runner."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Private Brightdesk validation failed::$BRIGHTDESK_PROJECT failed during $stage. Detailed output was kept only on the temporary runner."
            exit "$status"
          }
          run_safely() {
            local stage="$1"
            shift
            if "$@" >> "$log_file" 2>&1; then
              echo "Passed: $stage"
            else
              local status="$?"
              fail_stage "$stage" "$status"
            fi
          }
          run_safely "locked dependency installation" npm ci --no-audit --no-fund
          run_safely "Node.js runtime validation" npm run check:node
          run_safely "syntax validation" npm run check
          run_safely "contract and regression tests" npm test
          if [[ "$BRIGHTDESK_PROJECT" == "Brightdesk-Developer-Tools" ]]; then
            run_safely "JSON diagnostic validation" bash -euc 'node bin/brightdesk-dev.mjs doctor --root . --json > "$RUNNER_TEMP/brightdesk-developer-tools-doctor.json"'
          fi
          {
            echo "## Private Brightdesk engineering validation"
            echo
            echo "- Project: $BRIGHTDESK_PROJECT"
            echo "- Result: **PASSED**"
            echo "- Runtime: ${{ steps.node-version.outputs.value }}"
            echo "- Detailed output was kept only on the temporary runner."
          } >> "$GITHUB_STEP_SUMMARY"

  suite-one-time-installer-smoke-tests:
    name: Build Brightdesk Suite for ${{ matrix.platform }}
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build-brightdesk-suite-installers]')
    needs: [daily-private-tests, daily-private-foundation-tests]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: windows-latest
            verify_script: release:verify:win
          - platform: mac
            runner: macos-latest
            verify_script: release:verify:mac
          - platform: linux
            runner: ubuntu-latest
            verify_script: release:verify:linux
    steps:
      - name: Check out the Brightdesk Pages controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
      - name: Check whether read-only GitHub App credentials are configured
        id: private-token
        shell: bash
        env:
          APP_ID: ${{ vars.BRIGHTDESK_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Private project installer checks are paused until the Brightdesk App credentials are configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create a short-lived read-only token for Brightdesk Suite
        id: app-token
        if: steps.private-token.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BRIGHTDESK_APP_ID }}
          private-key: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Brightdesk-suite
          permission-contents: read
      - name: Check out Brightdesk Suite main
        if: steps.private-token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Brightdesk-suite
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: source
          persist-credentials: false
      - name: Set up the required Node.js runtime
        if: steps.private-token.outputs.available == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Build, verify and smoke-test the Suite installer
        id: build-installer
        if: steps.private-token.outputs.available == 'true'
        shell: bash
        run: |
          bash controller/scripts/brightdesk-private-runner/run-private-project-check.sh \
            build source "Brightdesk-suite" "${{ matrix.platform }}" "${{ matrix.verify_script }}"
      - name: Create an issue-only token for the private installer diagnostic
        id: installer-issue-token
        if: failure() && steps.build-installer.outputs.installer_failure_summary_file != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BRIGHTDESK_APP_ID }}
          private-key: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Brightdesk-suite
          permission-issues: write
      - name: Save sanitised installer diagnostics to private Suite issue
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.installer-issue-token.outputs.token }}
          BRIGHTDESK_INSTALLER_FAILURE_SUMMARY_FILE: ${{ steps.build-installer.outputs.installer_failure_summary_file }}
          BRIGHTDESK_INSTALLER_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          if [[ -n "$GITHUB_TOKEN" && -s "$BRIGHTDESK_INSTALLER_FAILURE_SUMMARY_FILE" ]]; then
            node controller/scripts/brightdesk-private-runner/report-private-installer-failure.js
          else
            echo "No sanitised installer diagnostic needs to be posted."
          fi
  weekly-private-installer-builds:
    name: Build ${{ matrix.project }} for ${{ matrix.platform }}
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 17 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.project == 'all' && inputs.run_cross_platform_builds == true && inputs.run_reviewed_product_pr_matrix != true)
    needs: [daily-private-tests, daily-private-foundation-tests]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Brightdesk-suite
            platform: win
            runner: windows-latest
            verify_script: release:verify:win
          - project: Brightdesk-suite
            platform: mac
            runner: macos-latest
            verify_script: release:verify:mac
          - project: Brightdesk-suite
            platform: linux
            runner: ubuntu-latest
            verify_script: release:verify:linux
          - project: Brightdesk-Sheets
            platform: win
            runner: windows-latest
            verify_script: verify:product:win
          - project: Brightdesk-Sheets
            platform: mac
            runner: macos-latest
            verify_script: verify:product:mac
          - project: Brightdesk-Sheets
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:product:linux
          - project: Brightdesk-Decks
            platform: win
            runner: windows-latest
            verify_script: verify:product:win
          - project: Brightdesk-Decks
            platform: mac
            runner: macos-latest
            verify_script: verify:product:mac
          - project: Brightdesk-Decks
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:product:linux
          - project: Brightdesk-Notes
            platform: win
            runner: windows-latest
            verify_script: verify:product:win
          - project: Brightdesk-Notes
            platform: mac
            runner: macos-latest
            verify_script: verify:product:mac
          - project: Brightdesk-Notes
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:product:linux
          - project: Brightdesk-Database
            platform: win
            runner: windows-latest
            verify_script: verify:product:win
          - project: Brightdesk-Database
            platform: mac
            runner: macos-latest
            verify_script: verify:product:mac
          - project: Brightdesk-Database
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:product:linux
          - project: Brightdesk-Forms
            platform: win
            runner: windows-latest
            verify_script: verify:product:win
          - project: Brightdesk-Forms
            platform: mac
            runner: macos-latest
            verify_script: verify:product:mac
          - project: Brightdesk-Forms
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:product:linux
          - project: Brightdesk-Lists
            platform: win
            runner: windows-latest
            verify_script: verify:desktop:win
          - project: Brightdesk-Lists
            platform: mac
            runner: macos-latest
            verify_script: verify:desktop:mac
          - project: Brightdesk-Lists
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:desktop:linux
          - project: Brightdesk-Planner
            platform: win
            runner: windows-latest
            verify_script: verify:desktop:win
          - project: Brightdesk-Planner
            platform: mac
            runner: macos-latest
            verify_script: verify:desktop:mac
          - project: Brightdesk-Planner
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:desktop:linux
          - project: Brightdesk-To-Do
            platform: win
            runner: windows-latest
            verify_script: verify:desktop:win
          - project: Brightdesk-To-Do
            platform: mac
            runner: macos-latest
            verify_script: verify:desktop:mac
          - project: Brightdesk-To-Do
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:desktop:linux
          - project: Brightdesk-Workspace
            platform: win
            runner: windows-latest
            verify_script: verify:desktop:win
          - project: Brightdesk-Workspace
            platform: mac
            runner: macos-latest
            verify_script: verify:desktop:mac
          - project: Brightdesk-Workspace
            platform: linux
            runner: ubuntu-latest
            verify_script: verify:desktop:linux
    steps:
      - name: Check out the Brightdesk Pages controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
      - name: Check whether read-only GitHub App credentials are configured
        id: private-token
        shell: bash
        env:
          APP_ID: ${{ vars.BRIGHTDESK_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Private project checks are paused until BRIGHTDESK_APP_ID and BRIGHTDESK_APP_PRIVATE_KEY are configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create a short-lived read-only token for this project
        id: app-token
        if: steps.private-token.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BRIGHTDESK_APP_ID }}
          private-key: ${{ secrets.BRIGHTDESK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.project }}
          permission-contents: read
      - name: Check out the private Brightdesk project
        if: steps.private-token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          token: ${{ steps.app-token.outputs.token }}
          path: source
          persist-credentials: false
      - name: Set up the required Node.js runtime
        if: steps.private-token.outputs.available == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Build and verify the selected installer without publishing it
        if: steps.private-token.outputs.available == 'true'
        shell: bash
        run: |
          bash controller/scripts/brightdesk-private-runner/run-private-project-check.sh \
            build source "${{ matrix.project }}" "${{ matrix.platform }}" "${{ matrix.verify_script }}"
