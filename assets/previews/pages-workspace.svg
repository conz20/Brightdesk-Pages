<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Brightdesk Pages workspace preview</title><desc id="desc">Conceptual Brightdesk Pages document editor with navigation, formatting ribbon and a formatted proposal page.</desc><defs><linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#14233F"/><stop offset="1" stop-color="#0D1930"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#203657" flood-opacity=".10"/></filter></defs><rect width="1440" height="900" fill="#F3F6FA"/><rect width="232" height="900" fill="url(#side)"/><rect x="24" y="24" width="42" height="42" rx="12" fill="#526FE0"/><path d="M34 34h9v9h-9zm13 0h9v9h-9zM34 47h9v9h-9zm13 0h9v9h-9z" fill="#fff"/><text x="78" y="53" font-family="Arial" font-size="24" font-weight="700" fill="#fff">brightdesk</text><text x="28" y="112" font-family="Arial" font-size="10" letter-spacing="2" font-weight="700" fill="#8495B4">WORKSPACE</text><rect x="16" y="132" width="200" height="44" rx="10" fill="#293B60"/><text x="52" y="160" font-family="Arial" font-size="14" font-weight="700" fill="#fff">Documents</text><text x="52" y="215" font-family="Arial" font-size="14" fill="#C3CDE0">Recent</text><text x="52" y="263" font-family="Arial" font-size="14" fill="#C3CDE0">Starred</text><text x="52" y="311" font-family="Arial" font-size="14" fill="#C3CDE0">Templates</text><path d="M24 844h184" stroke="#354966"/><text x="28" y="872" font-family="Arial" font-size="11" fill="#A8B6D0">Saved on this device</text><text x="270" y="52" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2" fill="#7B8AA1">BRIGHTDESK PAGES</text><text x="270" y="97" font-family="Arial" font-size="31" font-weight="700" fill="#1C2D47">Project proposal</text><text x="270" y="126" font-family="Arial" font-size="14" fill="#738198">A clear space to write, format and finish your documents.</text><rect x="1124" y="48" width="118" height="42" rx="9" fill="#fff" stroke="#DDE4EE"/><text x="1183" y="74" text-anchor="middle" font-family="Arial" font-size="13" fill="#40516C">Share locally</text><rect x="1254" y="48" width="150" height="42" rx="9" fill="#315FCE"/><text x="1329" y="74" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">Export document</text><rect x="270" y="154" width="1134" height="54" rx="12" fill="#fff" stroke="#E1E7F0"/><g font-family="Arial" font-size="12" fill="#53627A"><text x="294" y="186">Home</text><text x="360" y="186">Insert</text><text x="426" y="186">Layout</text><text x="504" y="186">Review</text><text x="580" y="186">View</text></g><path d="M287 199h48" stroke="#315FCE" stroke-width="3" stroke-linecap="round"/><rect x="270" y="218" width="1134" height="50" rx="10" fill="#F9FAFC" stroke="#E1E7F0"/><g fill="#738198"><rect x="294" y="233" width="38" height="19" rx="4"/><rect x="342" y="233" width="38" height="19" rx="4"/><rect x="390" y="233" width="75" height="19" rx="4"/><rect x="476" y="233" width="38" height="19" rx="4"/><rect x="526" y="233" width="38" height="19" rx="4"/><rect x="589" y="233" width="72" height="19" rx="4"/></g><text x="704" y="247" font-family="Arial" font-size="11" fill="#8693A7">Font · Size · Paragraph · Styles</text><rect x="270" y="284" width="1134" height="580" rx="14" fill="#E9EEF5" stroke="#DEE5EF"/><rect x="504" y="306" width="668" height="534" rx="4" fill="#fff" stroke="#E1E6EE" filter="url(#shadow)"/><text x="570" y="388" font-family="Arial" font-size="12" letter-spacing="2" fill="#315FCE">PROJECT OVERVIEW</text><text x="570" y="438" font-family="Arial" font-size="32" font-weight="700" fill="#20314B">A better way to work</text><text x="570" y="472" font-family="Arial" font-size="15" fill="#65748A">A proposal for the next stage of the project.</text><path d="M570 506h526" stroke="#E6EBF2"/><text x="570" y="548" font-family="Arial" font-size="18" font-weight="700" fill="#263A57">Introduction</text><g fill="#BCC6D4"><rect x="570" y="572" width="520" height="7" rx="3.5"/><rect x="570" y="590" width="500" height="7" rx="3.5"/><rect x="570" y="608" width="514" height="7" rx="3.5"/><rect x="570" y="626" width="452" height="7" rx="3.5"/></g><rect x="570" y="664" width="526" height="78" rx="9" fill="#EDF3FF"/><rect x="570" y="664" width="5" height="78" rx="2" fill="#315FCE"/><text x="594" y="692" font-family="Arial" font-size="13" font-weight="700" fill="#304B78">Key recommendation</text><text x="594" y="717" font-family="Arial" font-size="12" fill="#64758F">Keep the important information easy to find and understand.</text><text x="570" y="788" font-family="Arial" font-size="11" fill="#9AA5B4">Page 1 of 4</text><text x="270" y="886" font-family="Arial" font-size="10" fill="#8B97A9">VISUAL DESIGN PREVIEW · Conceptual workspace screen; actual features remain subject to acceptance testing.</text></svg>